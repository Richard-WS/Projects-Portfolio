[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-system-positions"
version = "1.0.0"
description = "Monthly heliocentric ecliptic positions of the eight planets, 1900-2100, rendered as an interactive 2D scatter viewer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "astropy>=8,<9",
    "numpy>=1.26,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# ERFA warns on pre-1972 leap-second extrapolation and exact-boundary dates
# (1900/2100). Benign for this range; positions are verified by golden tests.
filterwarnings = ["ignore::erfa.core.ErfaWarning"]
