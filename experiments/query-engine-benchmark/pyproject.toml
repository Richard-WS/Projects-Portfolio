[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "querybench"
version = "0.1.0"
description = "Head-to-head benchmark of pandas, Polars, and DuckDB on a realistic analytics workload."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<3",
    "polars>=1.0,<2",
    "duckdb>=1.0,<2",
    "pyarrow>=14,<22",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
