[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lemonade-wars"
version = "1.0.0"
description = "A beverage-empire business simulation: Lemonade Stand's recipe economics meet Drug Wars' travelling commodity markets."
requires-python = ">=3.9"
dependencies = ["pygame-ce>=2.5"]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lemonade-wars = "lemonwars.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
