[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canlab"
version = "0.1.0"
description = "Statistics Canada labour-market warehouse: Python ETL into SQLite, with a documented SQL query catalog."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pandas>=3.0.5,<4",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
