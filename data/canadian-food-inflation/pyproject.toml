[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canadian-food-inflation"
version = "0.1.0"
description = "Analysis of grocery prices vs overall inflation in Canada, using Statistics Canada CPI table 18-10-0004-01."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest"]
report = ["matplotlib", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
