[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-failure-prediction"
version = "0.1.0"
description = "Predict imminent hard-drive failure from S.M.A.R.T. telemetry (Backblaze Q1 2024 dataset) with gradient boosting."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<4",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
diskfail = "diskfail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::RuntimeWarning"]
