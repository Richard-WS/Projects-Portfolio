# Disk failure prediction — example configuration.
# Relative paths resolve against this file's directory (configs/), so the
# data/, docs/ and outputs/ paths below land at the project root.

data:
  raw_dir: ../data/raw/backblaze
  # A directory of daily snapshot CSVs (Backblaze's format), or a single CSV.
  raw_csv: data_Q1_2024
  samples_dir: ../data/samples
  raw_sample: raw_smart_sample.csv.gz
  sample_drives: 250
  sample_days: 12
  max_drives: 60000
  smart_missing_threshold: 0.99
  seed: 42

labels:
  pre_failure_days: 30
  horizon_days: 7

features:
  window_days: 7
  min_window_obs: 3
  leadtime_horizons: [1, 3, 7, 14, 30]

split:
  test_size: 0.2
  seed: 42
  max_negative_drives: 40000

model:
  max_iter: 300
  learning_rate: 0.1
  min_samples_leaf: 20
  l2_regularization: 1.0
  cv_folds: 5

paths:
  feature_train: ../data/samples/features_train.csv.gz
  feature_test: ../data/samples/features_test.csv.gz
  leadtime_features: ../data/samples/leadtime_features.csv.gz
  model_path: ../outputs/model.joblib
  metrics_path: ../docs/metrics.json
  report_path: ../docs/disk-failure-report.html
  predictions_path: ../outputs/predictions.csv
